plugins {
  id 'application'
  id 'checkstyle'
  id 'idea'
  id 'jacoco'
}

repositories {
  mavenCentral()
}

sourceSets {
  main {
    java {
      srcDirs = ['src']
    }
    resources {
      srcDirs = ['res']
    }
  }
  test {
    java {
      srcDirs = ['test/java']
    }
    resources {
      srcDirs = ['test/resources']
    }
  }
}

tasks.withType(JavaCompile).configureEach {
  // Produce Java 17 bytecode regardless of the (>= 17) JDK that runs the build
  options.release = 17
  options.encoding = 'UTF-8'
}

ext {
  bouncyCastleVersion = '1.86'
  httpClientVersion = '4.5.14'
  slf4jVersion = '2.0.20'
  logbackVersion = '1.6.3'
  jacksonVersion = '2.22.3'
}

dependencies {
  implementation "org.bouncycastle:bcprov-jdk18on:${bouncyCastleVersion}"
  implementation "org.bouncycastle:bcpkix-jdk18on:${bouncyCastleVersion}"
  implementation 'commons-cli:commons-cli:1.11.0'
  implementation 'commons-io:commons-io:2.22.0'
  implementation 'org.bushe:eventbus:1.4'
  implementation("org.apache.httpcomponents:httpmime:${httpClientVersion}") {
    exclude group: 'commons-logging'
  }
  implementation("org.apache.httpcomponents:httpclient:${httpClientVersion}") {
    exclude group: 'commons-logging'
  }
  implementation("org.apache.httpcomponents:fluent-hc:${httpClientVersion}") {
    exclude group: 'commons-logging'
  }
  implementation 'net.sf.kxml:kxml2:2.3.0'
  implementation('org.getodk:javarosa:6.0.0') {
    exclude group: 'org.slf4j'
    exclude group: 'ch.qos.logback'
    // Test library wrongly published in JavaRosa's compile scope
    exclude group: 'org.hamcrest'
  }
  implementation 'org.hsqldb:hsqldb:2.7.4'
  implementation('com.brsanthu:google-analytics-java:2.0.0') {
    exclude group: 'org.slf4j'
    exclude group: 'org.apache.httpcomponents', module: 'httpclient'
  }
  implementation 'com.github.lgooddatepicker:LGoodDatePicker:11.2.1'

  implementation 'de.grundid.opendatalab:geojson-jackson:1.14'
  implementation platform("com.fasterxml.jackson:jackson-bom:${jacksonVersion}")
  implementation 'com.fasterxml.jackson.core:jackson-core'
  implementation 'com.fasterxml.jackson.core:jackson-databind'
  implementation 'com.fasterxml.jackson.core:jackson-annotations'

  implementation files('lib/smallsql-0.21.jar')

  implementation "org.slf4j:slf4j-api:${slf4jVersion}"
  implementation "org.slf4j:jcl-over-slf4j:${slf4jVersion}"
  implementation "ch.qos.logback:logback-classic:${logbackVersion}"
  implementation('io.sentry:sentry-logback:8.57.0') {
    exclude group: 'org.slf4j'
    exclude group: 'ch.qos.logback'
  }

  testImplementation('junit:junit:4.13.2') {
    exclude group: 'org.hamcrest'
  }
  testImplementation 'org.hamcrest:hamcrest:3.0'
  testImplementation 'com.github.npathai:hamcrest-optional:2.0.0'
  testImplementation 'org.assertj:assertj-swing-junit:3.17.1' // Required for Swing tests
  testImplementation 'com.github.dreamhead:moco-core:1.6.1'
}

configurations.configureEach {
  // Logging goes through SLF4J; make sure no other binding sneaks in
  exclude group: 'commons-logging', module: 'commons-logging'
}

tasks.withType(Test).configureEach {
  useJUnit()
  // assertj-swing reflects into javax.swing internals, which JDK 17+ blocks by default
  jvmArgs '--add-opens', 'java.desktop/javax.swing=ALL-UNNAMED',
      '--add-opens', 'java.desktop/java.awt=ALL-UNNAMED',
      '--add-opens', 'java.base/java.lang=ALL-UNNAMED'
  systemProperty 'java.awt.headless', 'false'
  testLogging {
    events 'failed'
    exceptionFormat = 'full'
  }
}

jacocoTestReport {
  reports {
    xml.required = true
    html.required = true
  }
}

checkstyle {
  toolVersion = '14.1.0'
  configFile = file('config/checkstyle/checkstyle.xml')
}

// Use the result of `git describe --tags --dirty --always` as the version name
def gitDescribe = providers.exec {
  commandLine 'git', 'describe', '--tags', '--dirty', '--always'
  ignoreExitValue = true
}.standardOutput.asText.map { it.trim() }

String getValue(String key, String defaultValue) {
  if (this.hasProperty(key))
    return this.getProperty(key)
  else
    return defaultValue
}

def appName = 'ODK Briefcase'
def appVersion = gitDescribe.getOrElse('')
if (appVersion.isEmpty())
  appVersion = 'unknown'

version = appVersion

// Generates org.opendatakit.briefcase.buildconfig.BuildConfig, which used to be
// produced by the (unmaintained) de.fuerstenau.buildconfig plugin.
def buildConfigDir = layout.buildDirectory.dir('generated/sources/buildConfig/java/main')
def buildConfigValues = [
    VERSION           : appVersion,
    NAME              : appName,
    GOOGLE_TRACKING_ID: getValue('googleAnalytics.trackingId', 'UA-91951913-3'),
    SENTRY_ENABLED    : getValue('sentry.enabled', 'false'),
    SENTRY_DSN        : getValue('sentry.dsn', 'https://b6f023a5f17e44d9a46447f8827e2a41:1b1f33d68b1b4404b85cd627563d37f9@sentry.io/287258'),
]

def generateBuildConfig = tasks.register('generateBuildConfig') {
  def outputDir = buildConfigDir
  def values = buildConfigValues
  inputs.property('values', values)
  outputs.dir(outputDir)
  doLast {
    def packageDir = outputDir.get().dir('org/opendatakit/briefcase/buildconfig').asFile
    packageDir.mkdirs()
    new File(packageDir, 'BuildConfig.java').text = """\
package org.opendatakit.briefcase.buildconfig;

/** DO NOT EDIT. GENERATED CODE */
public final class BuildConfig {
  private BuildConfig() { /* no instance */ }

  public static final String VERSION = "${values.VERSION}";

  public static final String NAME = "${values.NAME}";

  public static final String GOOGLE_TRACKING_ID = "${values.GOOGLE_TRACKING_ID}";

  public static final Boolean SENTRY_ENABLED = ${values.SENTRY_ENABLED};

  public static final String SENTRY_DSN = "${values.SENTRY_DSN}";
}
"""
  }
}

sourceSets.main.java.srcDir(generateBuildConfig)

application {
  mainClass = 'org.opendatakit.briefcase.Launcher'
}

jar {
  archiveFileName = "ODK-Briefcase-${appVersion}.jar"
  from configurations.runtimeClasspath

  // A single-click Java app requires a flat jar or class loader.
  // Fat/Flat/uber/shadow jars won't work because BouncyCastle is signed.
  // Eclipse's Jar-in-Jar loader is the most maintained.
  // https://git.eclipse.org/c/jdt/eclipse.jdt.ui.git/plain/org.eclipse.jdt.ui/jar-in-jar-loader.zip
  from zipTree('lib/jar-in-jar-loader.zip')

  duplicatesStrategy = DuplicatesStrategy.EXCLUDE

  def runtimeJarNames = configurations.runtimeClasspath.elements.map { files -> files.collect { it.asFile.name }.join(' ') }
  manifest {
    attributes 'Main-Class': 'org.eclipse.jdt.internal.jarinjarloader.JarRsrcLoader'
    attributes 'Rsrc-Main-Class': application.mainClass.get()
    attributes 'Class-Path': '.'
    attributes 'Rsrc-Class-Path': runtimeJarNames.map { './ ' + it }
  }
}

// Useful for testing
tasks.register('explodedJar', Copy) {
  into layout.buildDirectory.dir("libs/ODK-Briefcase-${appVersion}")
  with jar
}
